<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indie Horror Reviews</title>
<meta name="description" content="Honest reviews of indie horror games, rated across five categories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d11;
    --surface: #15171d;
    --surface-2: #1c1f27;
    --border: #272b36;
    --border-strong: #353a48;
    --text: #ecedf1;
    --muted: #8d93a3;
    --faint: #5c6273;
    --accent: #e5484d;
    --accent-hover: #f2555a;
    --accent-soft: rgba(229, 72, 77, 0.12);
    --star: #f5b301;
    --star-empty: #3a3f4c;
    --success: #3dd68c;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(1200px 500px at 50% -200px, rgba(229,72,77,0.08), transparent 70%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(145deg, #2a1416, #170c0d);
    border: 1px solid #3b1d20;
    display: grid; place-items: center;
  }
  .logo svg { width: 22px; height: 22px; }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); }

  .tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .tab {
    border: 0; background: transparent; padding: 8px 16px; border-radius: 9px;
    color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset; }
  .count { background: var(--border); color: var(--text); font-size: 12px; padding: 1px 8px; border-radius: 99px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  .card-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0 0 18px; }

  /* Stepper */
  .stepper { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .step { display: flex; align-items: center; gap: 10px; color: var(--faint); font-weight: 600; font-size: 14px; }
  .step .dot {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-strong);
    display: grid; place-items: center; font-size: 13px;
  }
  .step.active { color: var(--text); }
  .step.active .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step.done { color: var(--muted); }
  .step.done .dot { background: var(--surface-2); color: var(--success); border-color: var(--border-strong); }
  .step-line { flex: 1; height: 1px; background: var(--border); max-width: 80px; }

  /* Form */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 600; color: var(--muted); }
  label .req { color: var(--accent); }
  input[type=text], input[type=url], input[type=search], select, textarea {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 14px; outline: none; transition: border-color .15s, box-shadow .15s; width: 100%;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 140px; line-height: 1.6; }
  .hint { font-size: 12px; color: var(--faint); }

  /* Buttons */
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .actions.end { justify-content: flex-end; }
  .btn {
    border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
    padding: 10px 18px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s, opacity .15s; text-decoration: none; font-size: 14px;
  }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-left: 6px; padding-right: 6px; }
  .btn.ghost:hover { color: var(--text); }
  .btn.danger { background: transparent; color: #ff8a8d; border-color: #4a2427; }
  .btn.danger:hover { background: rgba(229,72,77,0.1); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Game header (step 2) */
  .game-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .game-name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; line-height: 1.2; word-break: break-word; }
  .game-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  .pill { background: var(--surface-2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 99px; font-size: 13px; color: var(--text); }
  .link-pill { display: inline-flex; align-items: center; gap: 6px; color: var(--text); text-decoration: none; }
  .link-pill:hover { border-color: var(--faint); }

  /* Ratings */
  .rating-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .rating-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .rating-row:first-child { padding-top: 0; }
  .rating-info h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .rating-info p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .stars { display: flex; gap: 2px; flex-shrink: 0; }
  .star-btn { background: none; border: 0; padding: 3px; cursor: pointer; line-height: 0; border-radius: 6px; }
  .star-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .star-btn svg { width: 28px; height: 28px; transition: transform .1s; }
  .star-btn:hover svg { transform: scale(1.12); }
  .star-btn svg path { fill: var(--star-empty); transition: fill .1s; }
  .star-btn.on svg path { fill: var(--star); }

  /* Final score */
  .score-box {
    margin-top: 20px; border-radius: var(--radius-sm); padding: 18px 20px;
    border: 1px dashed var(--border-strong); color: var(--muted); font-size: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .score-box.ready {
    border: 1px solid #3b2b14; border-style: solid;
    background: linear-gradient(135deg, rgba(245,179,1,0.08), rgba(245,179,1,0.02));
    color: var(--text); justify-content: space-between; flex-wrap: wrap;
  }
  .score-label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .score-main { display: flex; align-items: center; gap: 14px; }
  .score-num { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .score-num small { font-size: 18px; color: var(--muted); font-weight: 600; }
  .progress-dots { display: flex; gap: 5px; }
  .progress-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
  .progress-dots span.on { background: var(--star); }

  /* Static (display) stars with partial fill */
  .stars-static { position: relative; display: inline-block; line-height: 0; }
  .stars-static .row { display: flex; gap: 2px; width: max-content; }
  .stars-static svg { flex-shrink: 0; display: block; }
  .stars-static svg path { fill: var(--star-empty); }
  .stars-static .fill { position: absolute; inset: 0; overflow: hidden; white-space: nowrap; }
  .stars-static .fill svg path { fill: var(--star); }
  .stars-static.lg svg { width: 26px; height: 26px; }
  .stars-static.sm svg { width: 15px; height: 15px; }

  /* Saved list */
  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .search { position: relative; flex: 1; min-width: 200px; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
  .search input { padding-left: 38px; }
  .toolbar select { width: auto; min-width: 170px; cursor: pointer; }

  .review-list { display: flex; flex-direction: column; gap: 10px; }
  .review-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    cursor: pointer; transition: border-color .15s, transform .15s, background .15s; text-align: left; width: 100%;
  }
  .review-item:hover { border-color: var(--border-strong); background: var(--surface-2); transform: translateY(-1px); }
  .review-item h3 { margin: 0; font-size: 16px; font-weight: 700; word-break: break-word; }
  .review-item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item-score { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .item-score b { font-size: 20px; font-weight: 800; }

  .empty { text-align: center; padding: 56px 20px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty h3 { color: var(--text); margin: 0 0 6px; font-size: 16px; }

  .backup { display: flex; justify-content: flex-end; gap: 4px; margin-top: 24px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(5,6,8,0.72); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; z-index: 20; }
  .overlay.open { display: flex; }
  .modal { width: 100%; max-width: 640px; }
  .breakdown { display: grid; gap: 10px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
  .bd-row span:first-child { color: var(--muted); }
  .review-text { white-space: pre-wrap; line-height: 1.7; margin: 0; word-break: break-word; }
  .muted { color: var(--muted); }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--surface-2); border: 1px solid var(--border-strong); padding: 12px 18px; border-radius: 12px;
    font-weight: 600; font-size: 14px; box-shadow: var(--shadow); transition: opacity .2s, transform .2s; z-index: 30;
    display: flex; align-items: center; gap: 10px; pointer-events: none; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .ok { color: var(--success); }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .wrap { padding-top: 20px; }
    .grid { grid-template-columns: 1fr; }
    .card { padding: 18px; }
    .rating-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .star-btn svg { width: 32px; height: 32px; }
    .game-name { font-size: 22px; }
    .tabs { width: 100%; }
    .tab { flex: 1; justify-content: center; }
    .review-item { flex-direction: column; align-items: flex-start; }
  }
</style>
<style>
  .hero { margin: 8px 0 24px; }
  .hero h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  .hero p { margin: 0; color: var(--muted); max-width: 560px; }
  .stats { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; }
  .stat b { display: block; font-size: 20px; font-weight: 800; }
  .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  footer { margin-top: 40px; text-align: center; color: var(--faint); font-size: 13px; }
  @media (max-width: 600px) { .hero h2 { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5l2.94 5.96 6.56.95-4.75 4.63 1.12 6.54L12 17.5l-5.87 3.08 1.12-6.54L2.5 9.41l6.56-.95L12 2.5z" fill="#e5484d"/></svg>
      </div>
      <div>
        <h1 id="siteName"></h1>
        <p id="siteTagline"></p>
      </div>
    </div>
  </header>

  <section class="hero">
    <h2>Indie horror, rated honestly</h2>
    <p>Every game scored on scares, atmosphere, story, gameplay, and value. Spoiler-free.</p>
    <div class="stats" id="stats"></div>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="Search by game or developer">
    </div>
    <select id="sortSelect" aria-label="Sort reviews">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="high">Highest score</option>
      <option value="low">Lowest score</option>
      <option value="az">A to Z</option>
    </select>
  </div>
  <div class="review-list" id="reviewList"><div class="empty"><p>Loading reviews…</p></div></div>

  <footer id="footer"></footer>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<script>
(() => {
  // ---- Edit these to match your channel ----
  const SITE_NAME = "Indie Horror Reviews";
  const SITE_TAGLINE = "Scores, verdicts, and where to play";
  // -------------------------------------------

  const CATEGORIES = [
    { key: "scare", name: "Scare Factor" },
    { key: "atmosphere", name: "Atmosphere & Sound" },
    { key: "story", name: "Story & Lore" },
    { key: "gameplay", name: "Gameplay & Polish" },
    { key: "value", name: "Value" },
  ];
  const STAR_PATH = "M12 2.5l2.94 5.96 6.56.95-4.75 4.63 1.12 6.54L12 17.5l-5.87 3.08 1.12-6.54L2.5 9.41l6.56-.95L12 2.5z";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  document.title = SITE_NAME;
  $("siteName").textContent = SITE_NAME;
  $("siteTagline").textContent = SITE_TAGLINE;
  $("footer").textContent = `© ${new Date().getFullYear()} ${SITE_NAME}`;

  let reviews = [];

  function starSvg() { return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}"/></svg>`; }
  function staticStars(score, size) {
    const pct = Math.max(0, Math.min(100, (score / 5) * 100));
    const row = `<span class="row">${starSvg().repeat(5)}</span>`;
    return `<span class="stars-static ${size}" aria-label="${score} out of 5 stars">${row}<span class="fill" style="width:${pct}%">${row}</span></span>`;
  }
  function formatDate(iso) {
    const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso || "") ? iso + "T12:00:00" : iso);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function safeHref(url) { return /^https?:\/\//i.test(url || "") ? url : "#"; }
  function linkLabel(url) {
    try {
      const host = new URL(url).hostname.replace(/^www\./, "");
      if (host.includes("steampowered")) return "Steam";
      if (host.includes("itch.io")) return "itch.io";
      if (host.includes("epicgames")) return "Epic Games";
      if (host.includes("gog.com")) return "GOG";
      return host;
    } catch { return "Store page"; }
  }
  const average = (scores) => Math.round((CATEGORIES.reduce((s, c) => s + (Number(scores?.[c.key]) || 0), 0) / CATEGORIES.length) * 10) / 10;

  // Accept both the web scorecard format and the older Python format.
  function normalize(r) {
    const nameToKey = Object.fromEntries(CATEGORIES.map((c) => [c.name, c.key]));
    const scores = {};
    Object.entries(r.scores || {}).forEach(([k, v]) => { scores[nameToKey[k] || k] = Number(v) || 0; });
    return {
      id: r.id || r.game,
      game: String(r.game || "Untitled"),
      developer: r.developer || "",
      price: r.price || "",
      link: r.link || r.where_to_play || "",
      scores,
      score: typeof r.score === "number" ? r.score : average(scores),
      review: r.review || r.comments || "",
      createdAt: r.createdAt || r.date || "",
    };
  }

  function renderStats() {
    if (!reviews.length) { $("stats").innerHTML = ""; return; }
    const avg = reviews.reduce((s, r) => s + r.score, 0) / reviews.length;
    const top = [...reviews].sort((a, b) => b.score - a.score)[0];
    $("stats").innerHTML = `
      <div class="stat"><b>${reviews.length}</b><span>Games reviewed</span></div>
      <div class="stat"><b>${avg.toFixed(1)}</b><span>Average score</span></div>
      <div class="stat"><b>${esc(top.game)}</b><span>Top rated</span></div>`;
  }

  function renderList() {
    const q = $("searchInput").value.trim().toLowerCase();
    const by = {
      newest: (a, b) => String(b.createdAt).localeCompare(String(a.createdAt)),
      oldest: (a, b) => String(a.createdAt).localeCompare(String(b.createdAt)),
      high: (a, b) => b.score - a.score,
      low: (a, b) => a.score - b.score,
      az: (a, b) => a.game.localeCompare(b.game),
    };
    const list = reviews
      .filter((r) => !q || r.game.toLowerCase().includes(q) || r.developer.toLowerCase().includes(q))
      .sort(by[$("sortSelect").value]);
    const el = $("reviewList");
    if (!reviews.length) { el.innerHTML = `<div class="empty"><h3>No reviews yet</h3><p>Check back soon.</p></div>`; return; }
    if (!list.length) { el.innerHTML = `<div class="empty"><h3>No matches</h3><p>Nothing found for "${esc(q)}".</p></div>`; return; }
    el.innerHTML = list.map((r) => `
      <button type="button" class="review-item" data-id="${esc(r.id)}">
        <div>
          <h3>${esc(r.game)}</h3>
          <div class="sub">${[r.developer && "by " + esc(r.developer), formatDate(r.createdAt)].filter(Boolean).join(" &middot; ")}</div>
        </div>
        <div class="item-score"><b>${r.score.toFixed(1)}</b>${staticStars(r.score, "sm")}</div>
      </button>`).join("");
    el.querySelectorAll(".review-item").forEach((b) => b.addEventListener("click", () => openReview(b.dataset.id)));
  }
  $("searchInput").addEventListener("input", renderList);
  $("sortSelect").addEventListener("change", renderList);

  function openReview(id) {
    const r = reviews.find((x) => String(x.id) === id);
    if (!r) return;
    const meta = [];
    if (r.developer) meta.push(`<span>by ${esc(r.developer)}</span>`);
    if (r.price) meta.push(`<span class="pill">${esc(r.price)}</span>`);
    if (formatDate(r.createdAt)) meta.push(`<span>${esc(formatDate(r.createdAt))}</span>`);
    $("modal").innerHTML = `
      <div class="card">
        <div class="game-head">
          <div><h2 class="game-name">${esc(r.game)}</h2><div class="game-meta">${meta.join("")}</div></div>
          <button class="btn ghost" type="button" id="closeBtn" aria-label="Close">&#10005;</button>
        </div>
        <div class="score-box ready">
          <span class="score-label">Final score</span>
          <div class="score-main"><span class="score-num">${r.score.toFixed(1)}<small> / 5</small></span>${staticStars(r.score, "lg")}</div>
        </div>
        ${r.link ? `<div style="margin-top:16px"><a class="btn primary" href="${esc(safeHref(r.link))}" target="_blank" rel="noopener">Where to play: ${esc(linkLabel(r.link))} &#8599;</a></div>` : ""}
      </div>
      <div class="card">
        <h2 class="card-title">Breakdown</h2>
        <div class="breakdown">
          ${CATEGORIES.map((c) => `<div class="bd-row"><span>${esc(c.name)}</span>${staticStars(r.scores[c.key] || 0, "sm")}</div>`).join("")}
        </div>
      </div>
      <div class="card">
        <h2 class="card-title">Review</h2>
        ${r.review ? `<p class="review-text">${esc(r.review)}</p>` : `<p class="muted">No written review.</p>`}
      </div>`;
    $("closeBtn").addEventListener("click", closeModal);
    $("overlay").classList.add("open");
    $("overlay").setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    $("overlay").classList.remove("open");
    $("overlay").setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }
  $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  fetch("reviews.json", { cache: "no-store" })
    .then((res) => { if (!res.ok) throw new Error(); return res.json(); })
    .then((data) => {
      reviews = (Array.isArray(data) ? data : []).filter((r) => r && r.game).map(normalize);
      renderStats(); renderList();
    })
    .catch(() => {
      $("reviewList").innerHTML = `<div class="empty"><h3>Couldn't load reviews</h3><p>Make sure reviews.json is uploaded next to this page.</p></div>`;
    });
})();
</script>
</body>
</html>
